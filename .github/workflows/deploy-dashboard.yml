name: Dashboard Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  GITHUB_IMAGE: ghcr.io/moonletlabs/sui-bridge:v${{ github.run_number }}
  IMAGE_ENV_VAR: DASHBOARD_IMAGE
  DEPLOYMENT_PATH: deployment
  STACK_NAME: sui_bridge
  PREVIEW_STACK_NAME: sui_bridge_preview

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Cache node modules
        uses: actions/cache@v6
        id: cache
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock', 'package.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Build docker image
        run: |
          yarn build-dashboard-image --tag $GITHUB_IMAGE

      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push $GITHUB_IMAGE

  # Every merge to main updates the preview (https://preview.suianalytics.io, behind Cloudflare Access)
  # automatically; production is then updated with the same image after approval.
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: build
    environment: preview

    env:
      ENV_NAME_SHORT: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update image name in env file
        run: |
          ed -s ${{ env.DEPLOYMENT_PATH }}/${{ env.ENV_NAME_SHORT }}.env <<< w
          echo "${{ env.IMAGE_ENV_VAR }}=$GITHUB_IMAGE" >> ${{ env.DEPLOYMENT_PATH }}/${{ env.ENV_NAME_SHORT }}.env

      - name: Deploy in swarm
        uses: MoonletLabs/portainer-swarm-deploy-action@main
        with:
          portainer_url: https://portainer.moonlet.cloud
          portainer_access_token: ${{ secrets.PORTAINER_ACCESS_TOKEN }}
          endpoint: moonlet-ai
          stack_name: ${{ env.PREVIEW_STACK_NAME }}
          compose_file: ${{ env.DEPLOYMENT_PATH }}/dashboard-preview.yml
          env_file: ${{ env.DEPLOYMENT_PATH }}/${{ env.ENV_NAME_SHORT }}.env

  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-preview

    env:
      ENV_NAME_SHORT: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update image name in env file
        run: |
          ed -s ${{ env.DEPLOYMENT_PATH }}/${{ env.ENV_NAME_SHORT }}.env <<< w
          echo "${{ env.IMAGE_ENV_VAR }}=$GITHUB_IMAGE" >> ${{ env.DEPLOYMENT_PATH }}/${{ env.ENV_NAME_SHORT }}.env

      - name: Deploy in swarm
        uses: MoonletLabs/portainer-swarm-deploy-action@main
        with:
          portainer_url: https://portainer.moonlet.cloud
          portainer_access_token: ${{ secrets.PORTAINER_ACCESS_TOKEN }}
          endpoint: moonlet-ai
          stack_name: ${{ env.STACK_NAME }}
          compose_file: ${{ env.DEPLOYMENT_PATH }}/dashboard.yml
          env_file: ${{ env.DEPLOYMENT_PATH }}/${{ env.ENV_NAME_SHORT }}.env
