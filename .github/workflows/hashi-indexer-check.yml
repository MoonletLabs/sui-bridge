name: Hashi indexer check

# Typechecks the Hashi indexer and checks its image builds. Nothing is published: Hashi hosts
# check out a release tag and build from it (see hashi-indexer/README.md).
#
# This is a public repository, so fork pull requests are skipped: only branches in this
# repository run it.

on:
  pull_request:
    branches:
      - main
    paths:
      - "hashi-indexer/**"
      - "src/utils/hashi-chain.ts"
      - "src/utils/sui-graphql.ts"
      - "src/config/hashi.ts"
      - ".github/workflows/hashi-indexer-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'MoonletLabs/sui-bridge' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: hashi-indexer/package-lock.json

      - name: Typecheck
        working-directory: hashi-indexer
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      # The build context is the repository root: the image reuses the dashboard's Hashi readers
      - name: Build image
        run: |
          docker build \
            --file hashi-indexer/Dockerfile \
            --build-arg VERSION=dev-${GITHUB_SHA::7} \
            --tag hashi-indexer:ci \
            .

      # Starts the image against a throwaway Postgres and checks that it comes up: the schema is applied
      # and /metrics answers with valid text. It does not need Sui to answer (the metrics server starts
      # first and the migration only needs the database), so a Sui outage cannot make this flaky.
      - name: Smoke test (starts, migrates, serves metrics)
        run: |
          docker run -d --name ci-db -p 5432:5432 \
            -e POSTGRES_USER=hashi_indexer -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=hashi \
            postgres:16-alpine
          docker run -d --name ci-indexer --network host \
            -e NETWORK=mainnet -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=hashi \
            -e DB_USER=hashi_indexer -e DB_PASSWORD=ci -e METRICS_PORT=9199 \
            hashi-indexer:ci

          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9199/metrics -o metrics.txt && break
            sleep 1
          done
          test -s metrics.txt || { echo "::error::/metrics did not answer within 60s"; exit 1; }

          grep -q '^hashi_indexer_info{version="dev-' metrics.txt \
            || { echo "::error::hashi_indexer_info is missing"; exit 1; }
          grep -q '^hashi_indexer_job_runs_total{result="error",task="events"} ' metrics.txt \
            || { echo "::error::job_runs_total is missing the task label"; exit 1; }

          # Every sample line must be valid exposition text
          bad=$(grep -vE '^(#|$)' metrics.txt | grep -vE '^[a-zA-Z_:][a-zA-Z0-9_:]*(\{.*\})? [-+0-9.eE]+$' || true)
          test -z "$bad" || { echo "::error::malformed metrics lines:"; echo "$bad"; exit 1; }

          for i in $(seq 1 60); do
            docker logs ci-indexer 2>&1 | grep -q '"msg":"migration applied"' && break
            sleep 1
          done
          docker logs ci-indexer 2>&1 | grep -q '"msg":"migration applied"' \
            || { echo "::error::the migration was not applied"; exit 1; }

          test "$(docker inspect -f '{{.State.Running}}' ci-indexer)" = "true" \
            || { echo "::error::the indexer container stopped"; exit 1; }

      - name: Container logs
        if: always()
        run: |
          docker logs ci-indexer 2>&1 | tail -30 || true
          docker rm -f ci-indexer ci-db 2>/dev/null || true
