name: Hashi indexer image

# Releases are tags named hashi-indexer-vX.Y (or vX.Y.Z). Pushing one publishes
# ghcr.io/moonletlabs/hashi-indexer:X.Y (and creates a GitHub Release with its digest).
# Pull requests and manual runs only typecheck and build, so main never publishes by itself.
#
#   git tag hashi-indexer-v1.0 && git push origin hashi-indexer-v1.0

on:
  pull_request:
    branches:
      - main
    paths:
      - "hashi-indexer/**"
      - "src/utils/hashi-chain.ts"
      - "src/utils/sui-graphql.ts"
      - "src/config/hashi.ts"
      - ".github/workflows/hashi-indexer-image.yml"
  push:
    tags:
      - "hashi-indexer-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/moonletlabs/hashi-indexer

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/hashi-indexer-v* ]]; then
            VERSION="${GITHUB_REF_NAME#hashi-indexer-v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not hashi-indexer-vMAJOR.MINOR (or MAJOR.MINOR.PATCH)"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="dev-${GITHUB_SHA::7}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: hashi-indexer/package-lock.json

      - name: Typecheck
        working-directory: hashi-indexer
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      # The build context is the repository root: the image reuses the dashboard's Hashi readers
      - name: Build image
        run: |
          docker build \
            --file hashi-indexer/Dockerfile \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --tag $IMAGE:${{ steps.version.outputs.version }} \
            .

      - name: Log in to the Github Container registry
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: steps.version.outputs.publish == 'true'
        run: |
          docker push $IMAGE:${{ steps.version.outputs.version }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ steps.version.outputs.version }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Hashi indexer ${{ steps.version.outputs.version }}"
            echo ""
            echo '```'
            echo "$IMAGE:${{ steps.version.outputs.version }}"
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A release page with the image to run, unless one was already created for this tag
      - name: Create the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving its notes alone"
            exit 0
          fi
          PRE=""
          [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" $PRE \
            --title "Hashi indexer $VERSION" \
            --generate-notes \
            --notes "Image: \`$IMAGE:$VERSION\`
          Digest: \`${{ steps.push.outputs.digest }}\`

          Run it on a host by setting \`HASHI_INDEXER_IMAGE\` in its \`.env\` to the digest above."
