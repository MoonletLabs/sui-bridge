name: Hashi indexer image

# Releases are tags named hashi-indexer-vX.Y (or vX.Y.Z). Pushing one publishes
# ghcr.io/moonletlabs/hashi-indexer:X.Y and creates a GitHub Release with its digest.
# Pull requests and manual runs only typecheck and build: nothing is published from them.
#
#   git tag hashi-indexer-v1.0 && git push origin hashi-indexer-v1.0
#
# This is a public repository, so who can trigger what is limited on purpose:
#  - pull requests run only when the branch lives in this repository (fork PRs are skipped);
#  - publishing needs a pushed tag (never a manual run) AND an approval on the
#    "hashi-indexer-release" environment, whose reviewers are the Moonlet team;
#  - the publish job is the only one with write permissions.

on:
  pull_request:
    branches:
      - main
    paths:
      - "hashi-indexer/**"
      - "src/utils/hashi-chain.ts"
      - "src/utils/sui-graphql.ts"
      - "src/config/hashi.ts"
      - ".github/workflows/hashi-indexer-image.yml"
  push:
    tags:
      - "hashi-indexer-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/moonletlabs/hashi-indexer

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    # Only this repository (not forks), and fork pull requests never run
    if: >-
      github.repository == 'MoonletLabs/sui-bridge' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: hashi-indexer/package-lock.json

      - name: Typecheck
        working-directory: hashi-indexer
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      # The build context is the repository root: the image reuses the dashboard's Hashi readers
      - name: Build image
        run: |
          docker build \
            --file hashi-indexer/Dockerfile \
            --build-arg VERSION=dev-${GITHUB_SHA::7} \
            --tag $IMAGE:dev-${GITHUB_SHA::7} \
            .

  publish:
    name: Publish release
    needs: check
    runs-on: ubuntu-latest
    # A pushed tag only: a manual run on a tag does not publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hashi-indexer-v')
    # Required reviewers (the Moonlet team) approve before this job gets its write token
    environment: hashi-indexer-release
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#hashi-indexer-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not hashi-indexer-vMAJOR.MINOR (or MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version is immutable: re-running this workflow for a tag that already has an
      # image must not rebuild it (the base image may have changed) or move the tag to other bytes
      # while the release still advertises the old digest.
      - name: Check whether this version is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if TAGS=$(gh api "/orgs/MoonletLabs/packages/container/hashi-indexer/versions?per_page=100" \
                --paginate --jq '.[].metadata.container.tags[]' 2>/tmp/lookup.err); then
            if printf '%s\n' "$TAGS" | grep -qx "$VERSION"; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$IMAGE:$VERSION is already published: not rebuilding or overwriting it"
            else
              echo "published=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q "HTTP 404" /tmp/lookup.err; then
            # No package yet: this is the first publish
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not tell whether $VERSION is published, stopping instead of risking an overwrite:"
            cat /tmp/lookup.err
            exit 1
          fi

      - name: Build image
        if: steps.existing.outputs.published != 'true'
        run: |
          docker build \
            --file hashi-indexer/Dockerfile \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --tag $IMAGE:${{ steps.version.outputs.version }} \
            .

      - name: Push image
        if: steps.existing.outputs.published != 'true'
        run: docker push $IMAGE:${{ steps.version.outputs.version }}

      # The digest of what is published under this version, whether it was just pushed or already there
      - name: Resolve the digest
        id: push
        run: |
          REF="$IMAGE:${{ steps.version.outputs.version }}"
          docker pull "$REF" >/dev/null
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REF")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Hashi indexer ${{ steps.version.outputs.version }}"
            echo ""
            [[ "${{ steps.existing.outputs.published }}" == "true" ]] && echo "Already published: left unchanged."
            echo ""
            echo '```'
            echo "$REF"
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A release page with the image to run, unless one was already created for this tag
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving its notes alone"
            exit 0
          fi
          PRE=""
          [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" $PRE \
            --title "Hashi indexer $VERSION" \
            --generate-notes \
            --notes "Image: \`$IMAGE:$VERSION\`
          Digest: \`${{ steps.push.outputs.digest }}\`

          Run it on a host by setting \`HASHI_INDEXER_IMAGE\` in its \`.env\` to the digest above."
