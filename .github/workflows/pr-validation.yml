name: Pull Request Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn build-dashboard-image
