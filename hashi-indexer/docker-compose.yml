# Hashi analytics store: a small Postgres plus ONE indexer, for ONE network (NETWORK in the env file).
# Each Hashi host runs its own stack: testnet on the testnet host, mainnet on the mainnet host.
#
#   on a Hashi host (image only, no source needed):
#       docker compose --env-file .env pull && docker compose --env-file .env up -d
#   locally, one stack per network, building the image from this repository
#   (the .env.local.* files set COMPOSE_FILE to include docker-compose.build.yml):
#       docker compose -p hashi-mainnet --env-file .env.local.mainnet up -d --build
#       docker compose -p hashi-testnet --env-file .env.local.testnet up -d --build
#
# The dashboard reads the database with the read-only role (hashi_reader).
name: hashi-indexer

services:
    hashi-db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: hashi
            POSTGRES_USER: hashi_admin
            POSTGRES_PASSWORD: ${HASHI_ADMIN_PASSWORD:?set HASHI_ADMIN_PASSWORD}
            HASHI_WRITER_PASSWORD: ${HASHI_WRITER_PASSWORD:?set HASHI_WRITER_PASSWORD}
            HASHI_READER_PASSWORD: ${HASHI_READER_PASSWORD:?set HASHI_READER_PASSWORD}
        command: >
            postgres -c shared_buffers=64MB -c max_connections=20 -c work_mem=4MB
            -c log_min_duration_statement=500
        volumes:
            - hashi_pgdata:/var/lib/postgresql/data
            - ./initdb:/docker-entrypoint-initdb.d:ro
        # Local: loopback only. On a Hashi host set DB_BIND to the interface the dashboard
        # reaches (and firewall the port to the dashboard worker).
        ports:
            - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5544}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U hashi_admin -d hashi"]
            interval: 10s
            timeout: 5s
            retries: 10
        mem_limit: 512m
        logging:
            driver: json-file
            options: { max-size: "10m", max-file: "3" }

    indexer:
        # Hosts run a released image: set HASHI_INDEXER_IMAGE to a version (or its digest) from the
        # releases page. There is deliberately no default, so nothing runs an unpinned image.
        # Locally, docker-compose.build.yml builds it from this repository instead.
        image: ${HASHI_INDEXER_IMAGE:?set HASHI_INDEXER_IMAGE, e.g. ghcr.io/moonletlabs/hashi-indexer:1.0}
        restart: unless-stopped
        depends_on:
            hashi-db:
                condition: service_healthy
        environment:
            NETWORK: ${NETWORK:?set NETWORK to mainnet or testnet}
            DATABASE_URL: postgres://hashi_indexer:${HASHI_WRITER_PASSWORD}@hashi-db:5432/hashi
            SNAPSHOT_SECONDS: ${SNAPSHOT_SECONDS:-600}
            EVENT_SECONDS: ${EVENT_SECONDS:-60}
            # Empty = the network's default (mainnet reads all history, testnet a few days)
            BACKFILL_DAYS: ${BACKFILL_DAYS:-}
        mem_limit: 256m
        cpus: 0.5
        healthcheck:
            test: ["CMD", "node", "healthcheck.cjs"]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 180s
        logging:
            driver: json-file
            options: { max-size: "10m", max-file: "3" }

volumes:
    hashi_pgdata:
